x-app: &app
  build: .
  image: suaplus-local:latest
  env_file: ${DEPLOY_ENV_FILE:-.env.deploy}
  environment:
    DB_HOST: database
    DB_PORT: '5432'
    REDIS_URL: redis://redis:6379/0
    CACHE_URL: redis://redis:6379/1
  init: true
  restart: unless-stopped
  volumes: [media:/app/media]
  depends_on:
    database: {condition: service_healthy}
    redis: {condition: service_healthy}
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
services:
  database:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME}
      POSTGRES_USER: ${DB_USER:?Set DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes: [database:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  redis:
    image: redis:7-bookworm
    command: [redis-server, --appendonly, 'yes']
    volumes: [redis:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  migrate:
    <<: *app
    command: [python, manage.py, migrate, --noinput]
    restart: 'no'
  web:
    <<: *app
    ports: ['${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8000}:8000']
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
  worker:
    <<: *app
    command: [celery, -A, config, worker, --loglevel=INFO, --concurrency=2]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  beat:
    <<: *app
    command: [celery, -A, config, beat, --loglevel=INFO, --schedule=/app/state/celerybeat-schedule]
    volumes: [beat:/app/state]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  backup:
    image: postgres:16-bookworm
    env_file: ${DEPLOY_ENV_FILE:-.env.deploy}
    environment:
      DB_HOST: database
      BACKUP_DIR: /backups
    volumes:
      - backups:/backups
      - ./scripts/backup_db.sh:/scripts/backup_db.sh:ro
    entrypoint: [bash, /scripts/backup_db.sh]
    profiles: [backup]
    depends_on:
      database: {condition: service_healthy}
volumes:
  database:
  redis:
  media:
  beat:
  backups:
