{% extends 'base.html' %}
{% load static %}

{% block title %}Checked out - {{ session.title }}{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto px-6 py-24 text-center">
    
    <h1 class="font-syncopate text-4xl md:text-5xl uppercase tracking-widest text-kec-charcoal mb-6">
        Checked out
    </h1>

    <p class="text-lg text-kec-charcoal font-medium mb-8">{{ session.title }}</p>

    <hr class="border-gray-200 w-24 mx-auto mb-10">

    <p class="text-base text-kec-grey leading-relaxed max-w-md mx-auto mb-12">
        Your attendance is complete. A secure link to your Sua+ Competency Passport has been sent to your email.
    </p>

    <div>
        <a href="/" class="btn-secondary">
            Back to Home
        </a>
    </div>

</div>
{% endblock %}
