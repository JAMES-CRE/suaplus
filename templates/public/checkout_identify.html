{% extends 'base.html' %}
{% load static %}

{% block title %}Check Out - {{ session.title }}{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto px-4 sm:px-6 py-8 md:py-12 pb-32">

    <div class="text-center mb-8">
        <div class="w-16 h-16 rounded-full bg-kec-charcoal text-white flex items-center justify-center mx-auto mb-4">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
        </div>
        <h1 class="font-syncopate text-3xl md:text-4xl uppercase tracking-wider text-kec-charcoal mb-2">Check Out</h1>
        <p class="text-sm text-kec-grey font-medium">{{ session.title }}</p>
    </div>

    {% if messages %}
        {% for message in messages %}
            <div class="mb-6 p-3 bg-red-50 text-kec-red text-sm rounded-kec">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <form method="post" class="bg-white border border-gray-200 rounded-kec p-5 sm:p-6 shadow-sm">
        {% csrf_token %}
        
        <div class="mb-6">
            <label class="block text-xs font-semibold text-kec-grey uppercase tracking-wider mb-2">Email or Staff/Student Number</label>
            <input type="text" name="identifier" class="form-input w-full" placeholder="e.g. james@knust.edu.gh" required autofocus>
        </div>

        <button type="submit" class="btn-primary w-full font-syncopate uppercase tracking-wider text-sm sm:text-base">
            Find My Record
        </button>
    </form>

</div>
{% endblock %}
