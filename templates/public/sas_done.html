{% extends 'base.html' %}
{% load static %}

{% block title %}Assessment Complete - Sua+{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center px-6 py-12">
    <div class="max-w-md w-full text-center">

        <h1 class="font-syncopate text-4xl md:text-5xl uppercase tracking-widest text-kec-charcoal mb-6">
            Complete
        </h1>

        <hr class="border-gray-200 w-24 mx-auto mb-8">

        <p class="text-base text-kec-grey leading-relaxed mb-10">
            Thank you. Your baseline has been recorded and your Sua+ passport link is on its way to your email.
        </p>

        <a href="{{ passport_url }}" class="btn-primary w-full block text-center font-syncopate uppercase tracking-wider text-base mb-4">
            View My Passport
        </a>

        <a href="/" class="text-xs text-kec-grey hover:text-kec-red underline">
            Back to Home
        </a>

    </div>
</div>
{% endblock %}
