{% extends 'base.html' %}
{% load static %}

{% block title %}Confirm Profile - Sua+{% endblock %}

{% block content %}
<div class="max-w-xl md:max-w-2xl mx-auto px-6 py-12 pb-32">

    <!-- Header -->
    <div class="mb-10 text-center md:text-left">
        <h1 class="font-syncopate text-4xl md:text-5xl uppercase tracking-widest text-kec-charcoal mb-4">
            Confirm Profile
        </h1>
        <p class="text-base text-kec-grey mb-2">Please confirm your details before starting the assessment.</p>
    </div>

    <hr class="border-gray-200 mb-8">

    <form method="post" id="profile-form">
        {% csrf_token %}

        <div class="space-y-6">
            <!-- Name (Read-only) -->
            <div>
                <label class="block text-xs font-semibold text-kec-grey uppercase tracking-wider mb-2">Full Name</label>
                <input type="text" value="{{ person.full_name }}" class="form-input" readonly>
            </div>

            <!-- Email (Read-only) -->
            <div>
                <label class="block text-xs font-semibold text-kec-grey uppercase tracking-wider mb-2">Email</label>
                <input type="email" value="{{ person.email }}" class="form-input" readonly>
            </div>

            <!-- Title -->
            <div>
                <label class="block text-xs font-semibold text-kec-grey uppercase tracking-wider mb-2">Title</label>
                <select name="title" class="form-input" required>
                    <option value="">Select Title</option>
                    <option value="Prof." {% if person.title == "Prof." %}selected{% endif %}>Prof.</option>
                    <option value="Assoc. Prof." {% if person.title == "Assoc. Prof." %}selected{% endif %}>Assoc. Prof.</option>
                    <option value="Dr." {% if person.title == "Dr." %}selected{% endif %}>Dr.</option>
                    <option value="Ing." {% if person.title == "Ing." %}selected{% endif %}>Ing.</option>
                    <option value="Rev." {% if person.title == "Rev." %}selected{% endif %}>Rev.</option>
                    <option value="Mr." {% if person.title == "Mr." %}selected{% endif %}>Mr.</option>
                    <option value="Mrs." {% if person.title == "Mrs." %}selected{% endif %}>Mrs.</option>
                    <option value="Ms." {% if person.title == "Ms." %}selected{% endif %}>Ms.</option>
                </select>
            </div>

            <!-- Category -->
            <div>
                <label class="block text-xs font-semibold text-kec-grey uppercase tracking-wider mb-2">Category</label>
                <select name="category" class="form-input" required>
                    <option value="">Select Category</option>
                    <option value="academic" {% if person.category == "academic" %}selected{% endif %}>Academic Staff</option>
                    <option value="non_academic" {% if person.category == "non_academic" %}selected{% endif %}>Non-Academic Staff</option>
                    <option value="undergrad" {% if person.category == "undergrad" %}selected{% endif %}>Undergraduate Student</option>
                    <option value="postgrad" {% if person.category == "postgrad" %}selected{% endif %}>Postgraduate Student</option>
                </select>
            </div>

            <!-- Unit Selection with "Other" -->
                <div class="form-field">
                <label for="unit" class="block text-xs font-semibold text-kec-grey uppercase tracking-wider mb-2">Unit / Department</label>
                <select name="unit" id="unit" class="form-input w-full" onchange="toggleOtherUnit()">
                    <option value="">Select unit...</option>
                    {% for unit in units %}
                        <option value="{{ unit.id }}" {% if person.unit_id == unit.id %}selected{% endif %}>{{ unit.name }}</option>
                    {% endfor %}
                    <option value="other" {% if person.unit_other %}selected{% endif %}>Other (not listed)</option>
                </select>
                
                <div id="other-unit-box" class="mt-3 {% if not person.unit_other %}hidden{% endif %}">
                    <input type="text" name="unit_other" id="id_unit_other" value="{{ person.unit_other|default:'' }}" class="form-input w-full" placeholder="Please specify your department">
                </div>
            </div>
            

            <!-- Phone (Optional) -->
            <div>
                <label class="block text-xs font-semibold text-kec-grey uppercase tracking-wider mb-2">Phone (optional)</label>
                <input type="text" name="phone" value="{{ person.phone|default:'' }}" class="form-input">
            </div>
        </div>

        <!-- SUBMIT -->
        <div class="mt-12">
            <button type="submit" class="btn-primary w-full font-syncopate uppercase tracking-wider text-base">
                Save & Continue
            </button>
        </div>

    </form>
</div>

<!-- JavaScript to toggle the "Other" input -->
<script>
    function toggleOtherUnit() {
        const select = document.getElementById('id_unit');
        const otherBox = document.getElementById('other-unit-box');
        const otherInput = document.getElementById('id_unit_other');

        if (select.value === 'other') {
            otherBox.classList.remove('hidden');
            otherInput.required = true;
        } else {
            otherBox.classList.add('hidden');
            otherInput.required = false;
        }
    }

    // Run on page load in case the form is re-rendered with errors
    document.addEventListener("DOMContentLoaded", () => {
        toggleOtherUnit();
    });
</script>
{% endblock %}
