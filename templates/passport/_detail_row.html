<div class="flex items-start gap-4">
    <div style="width: 32px; height: 32px; flex-shrink: 0; margin-top: 2px; border-radius: 50%; background: #F3F4F6; display: flex; align-items: center; justify-content: center; color: #6B7280;" aria-hidden="true">
        <svg style="width: 16px; height: 16px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="{{ icon }}"></path></svg>
    </div>
    <div class="min-w-0">
        <p class="text-xs font-semibold text-kec-grey uppercase tracking-wider mb-1">{{ label }}</p>
        <p class="text-sm text-kec-charcoal font-medium break-words">{{ value }}</p>
    </div>
</div>
