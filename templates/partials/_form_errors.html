{% if form.errors %}<div class="form-error-summary" tabindex="-1" data-error-summary role="alert"><h2 class="text-base mb-2">Check the details below</h2><ul>{% for error in form.non_field_errors %}<li>{{ error }}</li>{% endfor %}{% for field in form %}{% for error in field.errors %}<li><a href="#{{ field.id_for_label }}">{{ field.label }}: {{ error }}</a></li>{% endfor %}{% endfor %}</ul></div>{% endif %}
