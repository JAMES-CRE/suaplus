<div class="form-grid"><div class="form-field"><label for="id_year_start" class="form-label">Start year</label><input type="number" name="year_start" id="id_year_start" value="{% if period %}{{ period.year_start }}{% else %}{{ request.POST.year_start|default:'' }}{% endif %}" min="2020" max="2100" required class="form-input" placeholder="2026"></div><div class="form-field"><label for="id_year_end" class="form-label">End year</label><input type="number" name="year_end" id="id_year_end" value="{% if period %}{{ period.year_end }}{% else %}{{ request.POST.year_end|default:'' }}{% endif %}" min="2020" max="2100" required class="form-input" placeholder="2027"></div></div><div class="form-field"><label for="id_semester" class="form-label">Semester</label><select name="semester" id="id_semester" class="form-input" required><option value="0"{% if period.semester == 0 %} selected{% endif %}>Full year</option><option value="1"{% if period.semester == 1 %} selected{% endif %}>First semester</option><option value="2"{% if period.semester == 2 %} selected{% endif %}>Second semester</option><option value="3"{% if period.semester == 3 %} selected{% endif %}>Summer</option></select></div><div class="form-grid"><div class="form-field"><label for="id_start_date" class="form-label">Start date</label><input type="date" name="start_date" id="id_start_date" value="{% if period %}{{ period.start_date|date:'Y-m-d' }}{% else %}{{ request.POST.start_date|default:'' }}{% endif %}" required class="form-input"></div><div class="form-field"><label for="id_end_date" class="form-label">End date</label><input type="date" name="end_date" id="id_end_date" value="{% if period %}{{ period.end_date|date:'Y-m-d' }}{% else %}{{ request.POST.end_date|default:'' }}{% endif %}" required class="form-input"></div></div>
